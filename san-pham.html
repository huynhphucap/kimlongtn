    function escapeHtml(str) {
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
      return String(str ?? '').replace(/[&<>"']/g, ch => map[ch]);

      const s = styles[type] || styles.success;
      toast.className = `${s.bg} text-white font-body text-sm font-medium rounded-xl px-4 py-3 flex items-center gap-2.5 max-w-xs shadow-[0_12px_28px_-12px_rgba(15,27,51,.35)]`;
      toast.innerHTML = `<span class="font-display font-800">${s.icon}</span><span>${escapeHtml(message)}</span>`;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    // ---------- Giỏ yêu cầu báo giá ----------
    const QUOTE_CART_KEY = 'kl_quote_cart';
    function getQuoteCart() {
      try { return JSON.parse(localStorage.getItem(QUOTE_CART_KEY)) || []; }
      catch { return []; }
    }
    function saveQuoteCart(list) {
      localStorage.setItem(QUOTE_CART_KEY, JSON.stringify(list));
    }
    function isInQuoteCart(id) {
      return getQuoteCart().some(x => String(x.id) === String(id));
    }
    function addToQuoteCart(p) {
      const cart = getQuoteCart();
      if (cart.some(x => String(x.id) === String(p.id))) return false;
      if (cart.length >= 20) { showToast('Chỉ được chọn tối đa 20 sản phẩm.', 'error'); return false; }
      cart.push({ id: p.id, name: p.name, price: p.new_price });
      saveQuoteCart(cart);
      renderQuoteCart();
      return true;
    }
    function removeFromQuoteCart(id) {
      saveQuoteCart(getQuoteCart().filter(x => String(x.id) !== String(id)));
      renderQuoteCart();
    }

    function renderQuoteCart() {
      const cart = getQuoteCart();
      const countEl = document.getElementById('quote-cart-count');
      countEl.textContent = cart.length;
      countEl.classList.toggle('hidden', cart.length === 0);

      const itemsEl = document.getElementById('quote-cart-items');
      const emptyEl = document.getElementById('quote-cart-empty');
      if (cart.length === 0) {
        itemsEl.innerHTML = '';
        emptyEl.classList.remove('hidden');
      } else {
        emptyEl.classList.add('hidden');
        itemsEl.innerHTML = cart.map(item => `
          <div class="flex items-center gap-2 px-4 py-2.5">
            <p class="flex-1 min-w-0 text-xs font-body text-navy-900/80 truncate">${escapeHtml(item.name)}</p>
            <button type="button" data-remove-quote="${escapeHtml(String(item.id))}" class="focus-ring shrink-0 text-navy-900/30 hover:text-red-600 transition-colors">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
            </button>
          </div>
        `).join('');
        itemsEl.querySelectorAll('[data-remove-quote]').forEach(btn => {
          btn.addEventListener('click', () => removeFromQuoteCart(btn.dataset.removeQuote));
        });
      }
    }

    const quoteCartBtn = document.getElementById('quote-cart-btn');
    const quoteCartPanel = document.getElementById('quote-cart-panel');
    quoteCartBtn.addEventListener('click', () => quoteCartPanel.classList.toggle('hidden'));
    document.getElementById('quote-cart-close').addEventListener('click', () => quoteCartPanel.classList.add('hidden'));
    document.addEventListener('click', (e) => {
      if (!quoteCartPanel.contains(e.target) && !quoteCartBtn.contains(e.target)) quoteCartPanel.classList.add('hidden');
    });
    renderQuoteCart();

    function renderSkeletons(count) {
      const grid = document.getElementById('product-grid');
      grid.innerHTML = Array.from({ length: count }).map(() => `
        <div class="bg-white border border-slate-200 rounded-2xl overflow-hidden flex flex-col">
          <div class="skeleton aspect-square"></div>
          <div class="p-3 pt-6 flex flex-col gap-2">
            <div class="skeleton h-4 rounded w-full"></div>
            <div class="skeleton h-3 rounded w-2/3"></div>
            <div class="skeleton h-5 rounded w-1/2 mt-1"></div>
          </div>
        </div>
      `).join('');
    }

    function renderProducts(products) {
      const grid = document.getElementById('product-grid');

      if (!products || products.length === 0) {
        grid.innerHTML = searchQuery
          ? `<div class="col-span-full text-center py-10 font-body text-navy-900/50">Không tìm thấy sản phẩm nào khớp với "${escapeHtml(searchQuery)}".</div>`
          : `<div class="col-span-full text-center py-10 font-body text-navy-900/50">Không có sản phẩm nào ở trang này.</div>`;
        return;
      }

      grid.innerHTML = products.map((p, i) => `
        <div class="card-enter hover-lift bg-white border border-slate-200 rounded-2xl overflow-hidden flex flex-col relative" style="animation-delay:${i * 60}ms">
          ${p.badge ? `<span class="absolute top-2 left-2 bg-white text-ember text-xs font-display font-700 px-2.5 py-1 rounded-full z-10 shadow-[0_2px_4px_rgba(0,0,0,.15)] border border-ember/20">${p.badge}</span>` : ''}
          <button type="button" data-quote-id="${p.id}"
                  class="quote-toggle-btn focus-ring absolute top-2 right-2 z-10 w-7 h-7 rounded-full flex items-center justify-center shadow-[0_2px_4px_rgba(0,0,0,.15)] transition-colors ${isInQuoteCart(p.id) ? 'in-cart' : ''}"
                  title="${isInQuoteCart(p.id) ? 'Đã thêm vào yêu cầu báo giá' : 'Thêm vào yêu cầu báo giá'}">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">${isInQuoteCart(p.id) ? '<path d="M20 6 9 17l-5-5"/>' : '<path d="M12 5v14M5 12h14"/>'}</svg>
          </button>
          <a href="chi-tiet-san-pham.html?id=${p.id}" class="aspect-square bg-slate-100 flex items-center justify-center overflow-hidden">
            <img src="${p.img}" alt="${p.name}" class="object-cover w-full h-full">
          </a>
          <div class="relative h-5">
            <div class="absolute -top-4 left-0 right-0 flex items-stretch drop-shadow-md">
              <span class="promo-ribbon text-white text-[11px] font-display font-800 uppercase px-3 py-1.5 flex-1 flex items-center justify-center rounded-l-sm">Khuyến Mãi Đặc Biệt</span>
              <span class="promo-badge-3d text-amber-900 text-xs font-display font-800 px-2.5 py-1.5 flex items-center rounded-r-sm">${p.discount}</span>
            </div>
          </div>
          <div class="p-3 pt-6 flex flex-col gap-1 flex-1 font-body">
            <a href="chi-tiet-san-pham.html?id=${p.id}" class="focus-ring text-sm font-display font-700 text-navy-950 hover:text-brand transition-colors leading-snug line-clamp-2 min-h-[2.5em]">${p.name}</a>
            <div class="price-strike text-navy-900/40 text-sm">${p.old_price}</div>
            <div class="flex items-center gap-2">
              <span class="text-ember-dark font-display font-800 text-lg">${p.new_price}</span>
              <span class="price-badge-3d text-white text-xs font-display font-700 px-1.5 py-0.5 rounded">${p.discount}</span>
            </div>
            <div class="flex flex-wrap gap-1 mt-1">
              ${(p.tags || []).map(t => `<span class="border border-slate-200 rounded px-2 py-0.5 text-[11px] text-navy-900/50">${t}</span>`).join('')}
            </div>
          </div>
        </div>
      `).join('');

      grid.querySelectorAll('.quote-toggle-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const p = products.find(x => String(x.id) === btn.dataset.quoteId);
          if (!p) return;

          let added;
          if (isInQuoteCart(p.id)) {
            removeFromQuoteCart(p.id);
            added = false;
            showToast('Đã bỏ khỏi yêu cầu báo giá.');
          } else {
            added = addToQuoteCart(p);
            if (added) showToast(`Đã thêm "${p.name}" vào yêu cầu báo giá!`);
          }

          btn.classList.toggle('in-cart', added);
          btn.title = added ? 'Đã thêm vào yêu cầu báo giá' : 'Thêm vào yêu cầu báo giá';
          btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">${added ? '<path d="M20 6 9 17l-5-5"/>' : '<path d="M12 5v14M5 12h14"/>'}</svg>`;
        });
      });
    }

    function renderPagination(totalItems, page) {
      const container = document.getElementById('pagination');
      const totalPages = Math.max(1, Math.ceil(totalItems / PAGE_SIZE));

      if (totalPages <= 1) {
        container.innerHTML = '';
        return;
      }

      const btn = (label, targetPage, { disabled = false, active = false } = {}) => `
        <button
          data-page="${targetPage}"
          ${disabled ? 'disabled' : ''}
          class="focus-ring pagination-btn min-w-[2.5rem] px-3 py-2 rounded-xl text-sm font-display font-700 transition-colors
            ${active ? 'bg-brand text-white shadow-[0_6px_14px_-6px_rgba(37,99,235,0.6)]' : ''}
            ${!active && !disabled ? 'border border-slate-200 text-navy-900/70 hover:bg-slate-150 hover:border-brand hover:text-brand' : ''}
            ${disabled ? 'border border-slate-200 text-navy-900/30 cursor-not-allowed' : ''}">
          ${label}
        </button>`;

      let html = btn('← Trước', page - 1, { disabled: page <= 1 });

      for (let i = 1; i <= totalPages; i++) {
        html += btn(i, i, { active: i === page });
      }

      html += btn('Sau →', page + 1, { disabled: page >= totalPages });

      container.innerHTML = html;

      container.querySelectorAll('.pagination-btn:not([disabled])').forEach(el => {
        el.addEventListener('click', () => {
          const target = parseInt(el.dataset.page, 10);
          if (target >= 1 && target <= totalPages) {
            loadProducts(target);
            window.scrollTo({ top: document.getElementById('product-grid').offsetTop - 100, behavior: 'smooth' });
          }
        });
      });
    }

    function renderCategoryFilters() {
      const container = document.getElementById('category-filters');
      container.innerHTML = CATEGORIES.map(cat => {
        const active = cat === currentCategory;
        return `
          <button
            data-cat="${cat}"
            class="focus-ring category-btn px-4 py-2 rounded-full text-sm font-display font-700 transition-colors
              ${active
                ? 'bg-brand text-white shadow-[0_6px_14px_-6px_rgba(37,99,235,0.6)]'
                : 'border border-slate-200 text-navy-900/70 hover:bg-slate-150 hover:border-brand hover:text-brand'}">
            ${cat}
          </button>`;
      }).join('');

      container.querySelectorAll('.category-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          if (btn.dataset.cat === currentCategory) return;
          currentCategory = btn.dataset.cat;
          loadProducts(1);
        });
      });
    }

    async function loadProducts(page = 1) {
      currentPage = page;
      renderSkeletons(PAGE_SIZE);
      renderCategoryFilters();
      const isConfigured = SUPABASE_URL.startsWith('https://') && SUPABASE_ANON_KEY.startsWith('eyJ');
      const from = (page - 1) * PAGE_SIZE;
      const to = from + PAGE_SIZE - 1;
      const filterActive = currentCategory !== 'Tất Cả';
      const searchActive = searchQuery.trim().length > 0;

      function applyLocalFilters(list) {
        let out = filterActive ? list.filter(p => p.category === currentCategory) : list;
        if (searchActive) {
          const q = searchQuery.trim().toLowerCase();
          out = out.filter(p => (p.name || '').toLowerCase().includes(q));
        }
        return out;
      }

      if (!isConfigured) {
        console.warn('Chưa cấu hình Supabase — đang hiển thị dữ liệu mẫu. Xem huong-dan-supabase.md để kết nối dữ liệu sống.');
        const filtered = applyLocalFilters(FALLBACK_PRODUCTS);
        renderProducts(filtered.slice(from, to + 1));
        renderPagination(filtered.length, page);
        return;
      }

      try {
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let query = supabase.from('products').select('*', { count: 'exact' }).order('id');
        if (filterActive) query = query.eq('category', currentCategory);
        if (searchActive) query = query.ilike('name', `%${searchQuery.trim()}%`);
        const { data, error, count } = await query.range(from, to);
        if (error) throw error;
        if (!data || data.length === 0) {
          renderProducts([]);
          renderPagination(0, page);
          return;
        }
        renderProducts(data);
        renderPagination(count ?? data.length, page);
      } catch (err) {
        console.error('Lỗi tải dữ liệu từ Supabase, dùng dữ liệu dự phòng:', err);
        const filtered = applyLocalFilters(FALLBACK_PRODUCTS);
        renderProducts(filtered.slice(from, to + 1));
        renderPagination(filtered.length, page);
      }
    }

    const urlCategoryParam = new URLSearchParams(location.search).get('category');
    if (urlCategoryParam && CATEGORIES.includes(urlCategoryParam)) {
      currentCategory = urlCategoryParam;
    }

    const searchInput = document.getElementById('search-input');
    const searchClear = document.getElementById('search-clear');
    let searchDebounceTimer = null;

    searchInput.addEventListener('input', () => {
      searchClear.classList.toggle('hidden', !searchInput.value);
      clearTimeout(searchDebounceTimer);
      searchDebounceTimer = setTimeout(() => {
        searchQuery = searchInput.value;
        loadProducts(1);
      }, 350);
    });
    searchClear.addEventListener('click', () => {
      searchInput.value = '';
      searchQuery = '';
      searchClear.classList.add('hidden');
      searchInput.focus();
      loadProducts(1);
    });

    loadProducts(1);

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js').catch(() => {});
    }
  </script>
</body>
</html>
