    // khi chính js/shared.js là bản cũ.
    function trySeo(fn) {
      try { fn(); } catch (e) { console.warn('Bỏ qua dữ liệu SEO:', e); }

    let currentCategory = "Tất Cả";

    let searchQuery = "";

    // LƯU Ý QUAN TRỌNG: giá đang lưu trong cơ sở dữ liệu dưới dạng CHỮ ("590.000 đ"),
    // không phải số. Nên không thể nhờ cơ sở dữ liệu sắp xếp/lọc theo giá được — nó sẽ
    // so sánh theo bảng chữ cái và cho kết quả sai ("1.200.000 đ" đứng trước "590.000 đ").
    // Vì vậy khi khách chọn sắp xếp hoặc lọc giá, ta tải danh sách về rồi tự xử lý.
    const SORT_OPTIONS = [
      { key: 'default',    label: 'Mặc định' },
      { key: 'price-asc',  label: 'Giá thấp → cao' },
      { key: 'price-desc', label: 'Giá cao → thấp' },
      { key: 'name-asc',   label: 'Tên A → Z' }
    ];

    const PRICE_RANGES = [
      { key: 'all',      label: 'Tất cả giá',            min: 0,       max: Infinity },
      { key: 'lt100',    label: 'Dưới 100 nghìn',        min: 0,       max: 100000 },
      { key: '100-500',  label: '100 – 500 nghìn',       min: 100000,  max: 500000 },
      { key: '500-1m',   label: '500 nghìn – 1 triệu',   min: 500000,  max: 1000000 },
      { key: 'gte1m',    label: 'Từ 1 triệu trở lên',    min: 1000000, max: Infinity }
    ];

    let currentSort = 'default';
    let currentPriceKey = 'all';

    // Số dòng tối đa tải về khi cần tự sắp xếp/lọc trong trình duyệt
    const MAX_CLIENT_ROWS = 1000;

    function priceRangeOf(key) {
      return PRICE_RANGES.find(r => r.key === key) || PRICE_RANGES[0];
    }

    // "590.000 đ" -> 590000. Cố ý khai báo riêng ở đây (dù js/shared.js có hàm tương tự)
    // để trang vẫn chạy đúng nếu trình duyệt còn giữ js/shared.js bản cũ trong bộ nhớ đệm.
    function priceValue(str) {
      const digits = String(str ?? '').replace(/[^\d]/g, '');
      return digits ? Number(digits) : null;
    }

    function applyPriceAndSort(list) {
      let out = list;

      if (currentPriceKey !== 'all') {
        const range = priceRangeOf(currentPriceKey);
        out = out.filter(p => {
          const v = priceValue(p.new_price);
          return v !== null && v >= range.min && v < range.max;
        });
      }

      if (currentSort === 'price-asc' || currentSort === 'price-desc') {
        const dir = currentSort === 'price-asc' ? 1 : -1;
        out = [...out].sort((a, b) => {
          const va = priceValue(a.new_price);
          const vb = priceValue(b.new_price);
          // Sản phẩm chưa điền giá luôn xếp cuối, dù sắp xếp tăng hay giảm
          if (va === null && vb === null) return 0;
          if (va === null) return 1;
          if (vb === null) return -1;
          return (va - vb) * dir;
        });
      } else if (currentSort === 'name-asc') {
        // 'vi' để sắp xếp đúng thứ tự chữ cái tiếng Việt (à, ă, â...)
        out = [...out].sort((a, b) => (a.name || '').localeCompare(b.name || '', 'vi'));
      }

      return out;
    }

    // Ghi lựa chọn hiện tại lên thanh địa chỉ để khách gửi đúng link kết quả cho người khác
    function syncUrl() {
      const params = new URLSearchParams();
      if (currentCategory !== 'Tất Cả') params.set('category', currentCategory);
      if (searchQuery.trim()) params.set('q', searchQuery.trim());
      if (currentPriceKey !== 'all') params.set('price', currentPriceKey);
      if (currentSort !== 'default') params.set('sort', currentSort);
      const qs = params.toString();
      history.replaceState(null, '', qs ? `${location.pathname}?${qs}` : location.pathname);
    }

    function clearAllFilters() {
      currentCategory = 'Tất Cả';
      currentPriceKey = 'all';
      currentSort = 'default';
      searchQuery = '';
      const input = document.getElementById('search-input');

        old_price: "650.000 đ", new_price: "490.000 đ",
        tags: ["Mâm Hồng Ngoại", "Hẹn Giờ", "Cảm Ứng"],
        img: "https://images.unsplash.com/photo-1556819132-52350b2a7836?w=300&h=300&fit=crop" }
    ];

    // ---------- Nút "Thêm vào giỏ báo giá" trên mỗi thẻ sản phẩm ----------
    // Nhiều sản phẩm được gộp vào 1 giỏ, sau đó gửi 1 yêu cầu báo giá duy nhất cho toàn
    // giỏ (xem initQuoteCartUI() trong js/shared.js). Mỗi nút có 3 trạng thái: chưa thêm
    // (default), đã thêm vào giỏ (in-cart) và đã gửi yêu cầu (sent — không thêm lại được).
    function quoteButtonState(id) {
      if (isQuoteSent(id)) return 'sent';
      if (isInCart(id)) return 'in-cart';
      return 'default';
    }
    function quoteButtonIcon(state) {
      const paths = {
        sent: '<path d="M20 6 9 17l-5-5"/>',
        'in-cart': '<path d="M5 12h14"/>',
        default: '<path d="M12 5v14M5 12h14"/>'
      };
      return `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">${paths[state]}</svg>`;
    }
    function updateQuoteButton(btn, id) {
      const state = quoteButtonState(id);
      btn.classList.toggle('quote-done', state === 'sent');
      btn.classList.toggle('quote-in-cart', state === 'in-cart');
      btn.title = state === 'sent' ? 'Bấm để bỏ yêu cầu báo giá này' : state === 'in-cart' ? 'Bỏ khỏi giỏ báo giá' : 'Thêm vào giỏ báo giá';
      btn.innerHTML = quoteButtonIcon(state);
    }
    function refreshAllQuoteButtons() {
      document.querySelectorAll('.quote-toggle-btn').forEach(btn => updateQuoteButton(btn, btn.dataset.quoteId));
    }
    const refreshCartUI = initQuoteCartUI(refreshAllQuoteButtons);

    async function toggleCartItem(product, btn) {
      if (isQuoteSent(product.id)) {
        const ok = await askConfirm('Bỏ yêu cầu báo giá?', `Bỏ yêu cầu báo giá đã gửi cho "${product.name}"? Bạn có thể thêm lại vào giỏ và gửi yêu cầu mới.`, 'Bỏ yêu cầu');
        if (!ok) return;
        unmarkQuoteSent(product.id);
        showToast(`Đã bỏ yêu cầu báo giá cho "${product.name}".`, 'info');
        updateQuoteButton(btn, product.id);
        refreshCartUI();
        return;
      }
      if (isInCart(product.id)) {
        removeFromCart(product.id);
        showToast(`Đã bỏ "${product.name}" khỏi giỏ báo giá.`, 'info');
      } else {
        addToCart(product);
        showToast(`Đã thêm "${product.name}" vào giỏ báo giá!`);
        flyToCart(btn);
      }
      updateQuoteButton(btn, product.id);
      refreshCartUI();
    }

    function renderSkeletons(count) {
      const grid = document.getElementById('product-grid');
      grid.innerHTML = Array.from({ length: count }).map(() => `
        <div class="bg-white border border-slate-200 rounded-2xl overflow-hidden flex flex-col">
          <div class="skeleton aspect-square"></div>
          <div class="p-3 pt-6 flex flex-col gap-2">
            <div class="skeleton h-4 rounded w-full"></div>
            <div class="skeleton h-3 rounded w-2/3"></div>
            <div class="skeleton h-5 rounded w-1/2 mt-1"></div>
          </div>
        </div>
      `).join('');
    }

    function renderProducts(products) {
      const grid = document.getElementById('product-grid');

      if (!products || products.length === 0) {
        // Nói rõ đang lọc theo cái gì, kèm nút xoá hết bộ lọc — tránh để khách bí không
        // biết vì sao trang trống rồi thoát ra luôn.
        const dieuKien = [];
        if (searchQuery.trim()) dieuKien.push(`từ khoá "${escapeHtml(searchQuery.trim())}"`);
        if (currentCategory !== 'Tất Cả') dieuKien.push(`danh mục "${escapeHtml(currentCategory)}"`);
        if (currentPriceKey !== 'all') dieuKien.push(`mức giá "${escapeHtml(priceRangeOf(currentPriceKey).label)}"`);

        grid.innerHTML = `
          <div class="col-span-full text-center py-12 font-body flex flex-col items-center gap-4">
            <p class="text-navy-900/60 max-w-md">
              Không tìm thấy sản phẩm nào${dieuKien.length ? ` khớp với ${dieuKien.join(' · ')}` : ''}.
            </p>
            ${dieuKien.length ? `
              <button type="button" id="btn-clear-filters"
                class="focus-ring inline-flex items-center gap-2 border-2 border-navy-950 text-navy-950 hover:bg-navy-950 hover:text-white font-display font-700 text-sm px-5 py-2.5 rounded-xl transition-colors">
                Xoá bộ lọc
              </button>` : ''}
          </div>`;

        const clearBtn = document.getElementById('btn-clear-filters');
        if (clearBtn) clearBtn.addEventListener('click', clearAllFilters);
        return;
      }

      grid.innerHTML = products.map((p, i) => `
        <div class="card-enter hover-lift bg-white border border-slate-200 rounded-2xl overflow-hidden flex flex-col relative" style="animation-delay:${i * 60}ms">
          ${p.badge ? `<span class="absolute top-2 left-2 bg-white text-ember text-xs font-display font-700 px-2.5 py-1 rounded-full z-10 shadow-[0_2px_4px_rgba(0,0,0,.15)] border border-ember/20">${escapeHtml(p.badge)}</span>` : ''}
          <button type="button" data-quote-id="${p.id}"
                  class="quote-toggle-btn focus-ring absolute top-2 right-2 z-10 w-7 h-7 rounded-full flex items-center justify-center shadow-[0_2px_4px_rgba(0,0,0,.15)] transition-colors ${quoteButtonState(p.id) === 'sent' ? 'quote-done' : ''} ${quoteButtonState(p.id) === 'in-cart' ? 'quote-in-cart' : ''}"
                  title="${quoteButtonState(p.id) === 'sent' ? 'Bấm để bỏ yêu cầu báo giá này' : quoteButtonState(p.id) === 'in-cart' ? 'Bỏ khỏi giỏ báo giá' : 'Thêm vào giỏ báo giá'}">
            ${quoteButtonIcon(quoteButtonState(p.id))}
          </button>
          <a href="chi-tiet-san-pham.html?id=${encodeURIComponent(p.id)}" class="aspect-square bg-slate-100 flex items-center justify-center overflow-hidden">
            <img src="${escapeHtml(p.img)}" alt="${escapeHtml(p.name)}"
                 width="300" height="300" loading="lazy" decoding="async"
                 class="object-cover w-full h-full">
          </a>
          <div class="relative h-5">
            <div class="absolute -top-4 left-0 right-0 flex items-stretch drop-shadow-md">
              <span class="promo-ribbon text-white text-[11px] font-display font-800 uppercase px-3 py-1.5 flex-1 flex items-center justify-center rounded-l-sm">Khuyến Mãi Đặc Biệt</span>
              <span class="promo-badge-3d text-amber-900 text-xs font-display font-800 px-2.5 py-1.5 flex items-center rounded-r-sm">${escapeHtml(p.discount)}</span>
            </div>
          </div>
          <div class="p-3 pt-6 flex flex-col gap-1 flex-1 font-body">
            <a href="chi-tiet-san-pham.html?id=${encodeURIComponent(p.id)}" class="focus-ring text-sm font-display font-700 text-navy-950 hover:text-brand transition-colors leading-snug line-clamp-2 min-h-[2.5em]">${escapeHtml(p.name)}</a>
            <div class="price-strike text-navy-900/40 text-sm">${escapeHtml(p.old_price)}</div>
            <div class="flex items-center gap-2">
              <span class="text-ember-dark font-display font-800 text-lg">${escapeHtml(p.new_price)}</span>
              <span class="price-badge-3d text-white text-xs font-display font-700 px-1.5 py-0.5 rounded">${escapeHtml(p.discount)}</span>
            </div>
            <div class="flex flex-wrap gap-1 mt-1">
              ${(p.tags || []).map(t => `<span class="border border-slate-200 rounded px-2 py-0.5 text-[11px] text-navy-900/50">${escapeHtml(t)}</span>`).join('')}
            </div>
          </div>
        </div>
      `).join('');

      grid.querySelectorAll('.quote-toggle-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const p = products.find(x => String(x.id) === btn.dataset.quoteId);
          if (p) toggleCartItem(p, btn);
        });
      });

      // Khai báo danh sách sản phẩm đang hiển thị cho Google (kèm giá)
      trySeo(() => injectJsonLd('ld-itemlist', {
        '@context': 'https://schema.org',
        '@type': 'ItemList',
        name: currentCategory === 'Tất Cả' ? 'Tất cả sản phẩm' : currentCategory,
        numberOfItems: products.length,
        itemListElement: products.map((p, i) => {
          const price = parsePriceNumber(p.new_price);
          const item = {
            '@type': 'Product',
            name: p.name,
            image: p.img,
            sku: String(p.id),
            url: `${SITE_URL}/chi-tiet-san-pham.html?id=${encodeURIComponent(p.id)}`
          };
          if (price) {
            item.offers = {
              '@type': 'Offer',
              price,
              priceCurrency: 'VND',
              availability: 'https://schema.org/InStock'
            };
          }
          return { '@type': 'ListItem', position: (currentPage - 1) * PAGE_SIZE + i + 1, item };
        })
      }));
    }

    function renderPagination(totalItems, page) {
      renderResultCount(totalItems);
      const container = document.getElementById('pagination');
      const totalPages = Math.max(1, Math.ceil(totalItems / PAGE_SIZE));

      if (totalPages <= 1) {
        container.innerHTML = '';
        return;
      }

      const btn = (label, targetPage, { disabled = false, active = false } = {}) => `
        <button
          data-page="${targetPage}"
          ${disabled ? 'disabled' : ''}
          class="focus-ring pagination-btn min-w-[2.5rem] px-3 py-2 rounded-xl text-sm font-display font-700 transition-colors
            ${active ? 'bg-brand text-white shadow-[0_6px_14px_-6px_rgba(37,99,235,0.6)]' : ''}
            ${!active && !disabled ? 'border border-slate-200 text-navy-900/70 hover:bg-slate-150 hover:border-brand hover:text-brand' : ''}
            ${disabled ? 'border border-slate-200 text-navy-900/30 cursor-not-allowed' : ''}">
          ${label}
        </button>`;

      let html = btn('← Trước', page - 1, { disabled: page <= 1 });

      for (let i = 1; i <= totalPages; i++) {
        html += btn(i, i, { active: i === page });
      }

      html += btn('Sau →', page + 1, { disabled: page >= totalPages });

      container.innerHTML = html;

      container.querySelectorAll('.pagination-btn:not([disabled])').forEach(el => {
        el.addEventListener('click', () => {
          const target = parseInt(el.dataset.page, 10);
          if (target >= 1 && target <= totalPages) {
            loadProducts(target);
            window.scrollTo({ top: document.getElementById('product-grid').offsetTop - 100, behavior: 'smooth' });
          }
        });
      });
    }

    function renderCategoryFilters() {
      const container = document.getElementById('category-filters');
      container.innerHTML = CATEGORIES.map(cat => {
        const active = cat === currentCategory;
        return `
          <button
            data-cat="${cat}"
            class="focus-ring category-btn px-4 py-2 rounded-full text-sm font-display font-700 transition-colors
              ${active
                ? 'bg-brand text-white shadow-[0_6px_14px_-6px_rgba(37,99,235,0.6)]'
                : 'border border-slate-200 text-navy-900/70 hover:bg-slate-150 hover:border-brand hover:text-brand'}">
            ${cat}
          </button>`;
      }).join('');

      container.querySelectorAll('.category-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          if (btn.dataset.cat === currentCategory) return;
          currentCategory = btn.dataset.cat;
          syncUrl();
          loadProducts(1);
        });
      });
    }

    // Nút lọc giá cố ý làm nhỏ và nhạt hơn nút danh mục, để danh mục vẫn là bộ lọc chính
    function renderPriceFilters() {
      const container = document.getElementById('price-filters');
      container.innerHTML = PRICE_RANGES.map(r => {
        const active = r.key === currentPriceKey;
        return `
          <button data-price="${r.key}"
            class="focus-ring price-btn px-3 py-1.5 rounded-lg text-xs font-body font-medium transition-colors
              ${active
                ? 'bg-navy-950 text-white'
                : 'border border-slate-200 text-navy-900/60 hover:border-brand hover:text-brand'}">
            ${r.label}
          </button>`;
      }).join('');

      container.querySelectorAll('.price-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          if (btn.dataset.price === currentPriceKey) return;
          currentPriceKey = btn.dataset.price;
          syncUrl();
          loadProducts(1);
        });
      });
    }

    function initSortSelect() {
      const sel = document.getElementById('sort-select');
      sel.innerHTML = SORT_OPTIONS.map(o => `<option value="${o.key}">${o.label}</option>`).join('');
      sel.value = currentSort;
      sel.addEventListener('change', () => {
        currentSort = sel.value;
        syncUrl();
        loadProducts(1);
      });
    }

    function renderResultCount(total) {
      const el = document.getElementById('result-count');
      const filtering = currentCategory !== 'Tất Cả' || currentPriceKey !== 'all' || searchQuery.trim();
      el.textContent = total > 0
        ? `${filtering ? 'Tìm thấy' : 'Có tất cả'} ${total} sản phẩm`
        : '';
    }

    async function loadProducts(page = 1) {
      currentPage = page;
      renderSkeletons(PAGE_SIZE);
      renderCategoryFilters();
      renderPriceFilters();

      const from = (page - 1) * PAGE_SIZE;
      const to = from + PAGE_SIZE - 1;
      const filterActive = currentCategory !== 'Tất Cả';
      const searchActive = searchQuery.trim().length > 0;

      // Sắp xếp/lọc theo giá phải làm trong trình duyệt (xem ghi chú ở phần khai báo
      // SORT_OPTIONS). Khi khách để mặc định thì vẫn phân trang phía máy chủ như cũ
      // cho nhẹ, chỉ khi thật sự cần mới tải nhiều dòng về.
      const needsClientSide = currentSort !== 'default' || currentPriceKey !== 'all';

      function applyLocalFilters(list) {
        let out = filterActive ? list.filter(p => p.category === currentCategory) : list;
        if (searchActive) {
          const q = searchQuery.trim().toLowerCase();
          out = out.filter(p => (p.name || '').toLowerCase().includes(q));
        }
        return applyPriceAndSort(out);
      }

      function showList(list) {
        renderProducts(list.slice(from, to + 1));
        renderPagination(list.length, page);
      }

      if (!isConfigured) {
        console.warn('Chưa cấu hình Supabase — đang hiển thị dữ liệu mẫu. Xem huong-dan-supabase.md để kết nối dữ liệu sống.');
        showList(applyLocalFilters(FALLBACK_PRODUCTS));
        return;
      }

      try {
        let query = sb.from('products').select('*', { count: 'exact' }).order('id');
        if (filterActive) query = query.eq('category', currentCategory);
        if (searchActive) query = query.ilike('name', `%${searchQuery.trim()}%`);

        if (needsClientSide) {
          const { data, error } = await query.range(0, MAX_CLIENT_ROWS - 1);
          if (error) throw error;
          showList(applyPriceAndSort(data || []));
          return;
        }

        const { data, error, count } = await query.range(from, to);
        if (error) throw error;
        renderProducts(data || []);
        renderPagination(count ?? (data || []).length, page);
      } catch (err) {
        console.error('Lỗi tải dữ liệu từ Supabase, dùng dữ liệu dự phòng:', err);
        showList(applyLocalFilters(FALLBACK_PRODUCTS));
      }
    }

    const urlParams = new URLSearchParams(location.search);
    const urlCategoryParam = urlParams.get('category');
    if (urlCategoryParam && CATEGORIES.includes(urlCategoryParam)) {
      currentCategory = urlCategoryParam;
    }

    // ?q=... — dùng khi Google hiện ô tìm kiếm riêng cho website (khai báo ở trang chủ),
    // và để có thể gửi đường dẫn kết quả tìm kiếm cho khách.
    const urlSearchParam = (urlParams.get('q') || '').trim();
    if (urlSearchParam) searchQuery = urlSearchParam;

    // ?price= và ?sort= — để khách gửi được đúng link kết quả đã lọc/sắp xếp cho người khác
    const urlPriceParam = urlParams.get('price');
    if (urlPriceParam && PRICE_RANGES.some(r => r.key === urlPriceParam)) currentPriceKey = urlPriceParam;

    const urlSortParam = urlParams.get('sort');
    if (urlSortParam && SORT_OPTIONS.some(o => o.key === urlSortParam)) currentSort = urlSortParam;

    const searchInput = document.getElementById('search-input');
    const searchClear = document.getElementById('search-clear');
    let searchDebounceTimer = null;

    searchInput.addEventListener('input', () => {
      searchClear.classList.toggle('hidden', !searchInput.value);
      clearTimeout(searchDebounceTimer);
      searchDebounceTimer = setTimeout(() => {
        searchQuery = searchInput.value;
        syncUrl();
        loadProducts(1);
      }, 350);
    });
    searchClear.addEventListener('click', () => {
      searchInput.value = '';
      searchQuery = '';
      searchClear.classList.add('hidden');
      searchInput.focus();
      syncUrl();
      loadProducts(1);
    });

    if (searchQuery) {
      searchInput.value = searchQuery;
      searchClear.classList.remove('hidden');
    }

    initSortSelect();

    trySeo(() => injectJsonLd('ld-breadcrumb', breadcrumbJsonLd([
      { name: 'Trang Chủ', file: 'index.html' },
      { name: 'Sản Phẩm', file: 'san-pham.html' }
    ])));

    loadProducts(1);
    registerServiceWorker();
  </script>
</body>
</html>
