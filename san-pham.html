<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cửa Hàng Kim Long - Đồ Điện Gia Dụng Giá Sốc</title>

<!-- PWA setup -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kim Long">

<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          navy: { 950: '#0B1220', 900: '#0F1B33', 800: '#152A4D' },
          brand: { DEFAULT: '#2563EB', light: '#5B8DFF' },
          ember: { DEFAULT: '#F97316', dark: '#C2540A' },
          slate: { 150: '#EEF1F6' }
        },
        fontFamily: {
          display: ['Sora', 'sans-serif'],
          body: ['Inter', 'sans-serif'],
          mono: ['JetBrains Mono', 'monospace']
        }
      }
    }
  }
</script>

<style>
  body { font-family: 'Inter', sans-serif; }
  .price-strike { text-decoration: line-through; }

  /* --- 3D promo ribbon (ember palette to match brand) --- */
  .promo-ribbon {
    position: relative;
    background: linear-gradient(180deg, #fb923c 0%, #f97316 55%, #c2540a 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.45),
      inset 0 -3px 4px rgba(0,0,0,.25),
      0 3px 6px rgba(194,84,10,.45);
    text-shadow: 0 1px 1px rgba(0,0,0,.35);
    letter-spacing: .02em;
  }
  .promo-ribbon::after{
    content:"";
    position:absolute; left:0; bottom:-6px;
    border-style: solid;
    border-width: 0 6px 6px 0;
    border-color: transparent #7c2d12 transparent transparent;
    filter: brightness(.7);
  }
  .promo-badge-3d {
    position: relative;
    background: linear-gradient(180deg, #ffe37a 0%, #fbbf24 55%, #f59e0b 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.6),
      inset 0 -3px 4px rgba(0,0,0,.25),
      0 3px 6px rgba(180,83,9,.5);
    text-shadow: 0 1px 0 rgba(255,255,255,.35);
  }
  .promo-badge-3d::before{
    content:"";
    position:absolute; inset:0;
    border-radius: inherit;
    background: linear-gradient(120deg, rgba(255,255,255,.55) 0%, rgba(255,255,255,0) 40%);
    pointer-events: none;
  }
  .price-badge-3d {
    background: linear-gradient(180deg, #fb923c 0%, #ea580c 60%, #c2540a 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.5),
      inset 0 -2px 3px rgba(0,0,0,.3),
      0 2px 4px rgba(194,84,10,.5);
    text-shadow: 0 1px 1px rgba(0,0,0,.3);
  }

  .focus-ring:focus-visible {
    outline: 2px solid #F97316;
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: no-preference) {
    .hover-lift { transition: transform .25s ease, box-shadow .25s ease; }
    .hover-lift:hover { transform: translateY(-4px); box-shadow: 0 16px 30px -12px rgba(15,27,51,0.35); }
  }
</style>
</head>
<body class="bg-slate-150 text-navy-950">

  <!-- Promo strip -->
  <div class="bg-navy-950 text-slate-200 text-sm">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between px-4 py-2 gap-2 font-body">
      <div class="flex flex-wrap items-center gap-3">
        <span class="bg-white/10 rounded-full px-3 py-1 flex items-center gap-1">📞 Hotline 0364.878.771</span>
      </div>
      <div class="flex items-center gap-4 text-xs md:text-sm text-slate-300">
        <span class="flex items-center gap-1">✔️ Khuyến mãi hot</span>
        <span class="flex items-center gap-1">📍 Hệ thống cửa hàng</span>
        <span class="flex items-center gap-1">📰 Tin tức nổi bật</span>
      </div>
    </div>
  </div>

  <!-- Header -->
  <header class="sticky top-0 z-50 bg-white/95 backdrop-blur border-b border-slate-200">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center gap-4 px-4 py-4">
      <a href="index.html"
         class="focus-ring flex items-center gap-2 shrink-0 bg-ember hover:bg-ember-dark text-white font-display font-700 text-sm sm:text-base px-4 py-2.5 rounded-xl shadow-[0_10px_20px_-8px_rgba(249,115,22,0.5)] transition-colors">
        <span aria-hidden="true" class="text-lg leading-none">←</span> Quay Về Trang Chủ
      </a>

      <div class="flex-1 min-w-[200px]">
        <div class="flex items-center border-2 border-brand rounded-full overflow-hidden">
          <input type="text" placeholder="Bạn cần tìm gì?" class="flex-1 px-4 py-2 outline-none text-sm font-body">
          <button class="focus-ring bg-brand text-white px-4 py-2">🔍</button>
        </div>
      </div>

      <div class="flex items-center gap-6 text-sm font-body text-navy-900/80 shrink-0">
        <div class="hidden lg:flex items-center gap-2">
          📞
          <div class="leading-tight">
            <div>0364.878.771</div>
          </div>
        </div>
        <div class="flex items-center gap-1">👤 <span class="hidden sm:inline">Tài khoản</span></div>
        <div class="flex items-center gap-1 relative">
          🛒 <span class="hidden sm:inline">Giỏ hàng</span>
          <span class="absolute -top-2 -right-3 bg-ember text-white text-[10px] rounded-full w-4 h-4 flex items-center justify-center">0</span>
        </div>
      </div>
    </div>

    <!-- Nav bar -->
    <div class="max-w-7xl mx-auto flex flex-wrap gap-2 px-4 pb-4 text-sm font-body font-medium">
      <button class="focus-ring bg-brand text-white rounded-xl px-4 py-2 flex items-center gap-2">☰ DANH MỤC SẢN PHẨM</button>
      <button class="focus-ring border border-slate-200 rounded-xl px-4 py-2 flex items-center gap-2 hover:bg-slate-150 transition-colors">🧾 GIAO LẮP CHUYÊN NGHIỆP</button>
      <button class="focus-ring border border-slate-200 rounded-xl px-4 py-2 flex items-center gap-2 hover:bg-slate-150 transition-colors">🔄 CHÍNH SÁCH ĐỔI TRẢ</button>
      <button class="focus-ring border border-slate-200 rounded-xl px-4 py-2 flex items-center gap-2 hover:bg-slate-150 transition-colors">🚚 CHÍNH SÁCH GIAO HÀNG</button>
      <button class="focus-ring border border-slate-200 rounded-xl px-4 py-2 flex items-center gap-2 hover:bg-slate-150 transition-colors">📍 SẢN PHẨM ĐÃ XEM</button>
    </div>
  </header>

  <!-- Breadcrumb -->
  <div class="max-w-7xl mx-auto px-4 py-4 text-sm font-body text-navy-900/50">
    <a href="index.html" class="hover:text-brand transition-colors">TRANG CHỦ</a> / <span class="text-navy-950 font-medium">SẢN PHẨM GIÁ SỐC</span>
  </div>

  <!-- Product grid -->
  <main class="max-w-7xl mx-auto px-4 pb-16">
    <div id="product-grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-4"></div>
  </main>

  <!-- Footer (matches index.html) -->
  <footer class="border-t border-slate-200 bg-white">
    <div class="max-w-7xl mx-auto px-5 py-8 text-center text-xs sm:text-sm text-navy-900/50 font-body">
      © 2026 Cửa Hàng Kim Long · Hotline 0364.878.771
    </div>
  </footer>

  <!-- Floating contact buttons -->
  <div class="fixed right-4 bottom-24 flex flex-col gap-3 z-40">
    <button class="focus-ring w-12 h-12 rounded-full bg-brand text-white flex items-center justify-center shadow-lg hover:bg-brand-light transition-colors">💬</button>
    <button class="focus-ring w-12 h-12 rounded-full bg-sky-400 text-white flex items-center justify-center shadow-lg hover:bg-sky-500 transition-colors">Z</button>
    <button class="focus-ring w-12 h-12 rounded-full bg-ember text-white flex items-center justify-center shadow-lg hover:bg-ember-dark transition-colors">📞</button>
  </div>

  <script>
    const products = [
      {
        badge: "Mẫu mới", discount: "-21%",
        name: "Nồi Cơm Điện Kim Long 1.8L",
        oldPrice: "750.000 đ", newPrice: "590.000 đ",
        tags: ["Chống Dính", "1.8L", "Giữ Ấm 24h"],
        img: "https://images.unsplash.com/photo-1599182345361-9542815e73f6?w=300&h=300&fit=crop"
      },
      {
        badge: null, discount: "-24%",
        name: "Quạt Điện Đứng Kim Long 3 Tốc Độ",
        oldPrice: "590.000 đ", newPrice: "450.000 đ",
        tags: ["3 Tốc Độ", "Cánh 40cm", "Tuốc Xoay"],
        img: "https://images.unsplash.com/photo-1601084195907-44baaa49dabd?w=300&h=300&fit=crop"
      },
      {
        badge: "Mẫu mới", discount: "-26%",
        name: "Quạt Trần Kim Long Cánh Gỗ Có Đèn",
        oldPrice: "1.200.000 đ", newPrice: "890.000 đ",
        tags: ["3 Cánh Gỗ", "Có Đèn", "Remote"],
        img: "https://images.unsplash.com/photo-1620348578890-740dd10e1fe5?w=300&h=300&fit=crop"
      },
      {
        badge: null, discount: "-36%",
        name: "Bóng Đèn LED Kim Long Tiết Kiệm Điện",
        oldPrice: "55.000 đ", newPrice: "35.000 đ",
        tags: ["Ánh Sáng Trắng", "Đui E27", "Tiết Kiệm Điện"],
        img: "https://images.unsplash.com/photo-1604322415766-3eccf7b56a0a?w=300&h=300&fit=crop"
      },
      {
        badge: null, discount: "-22%",
        name: "Bếp Điện Từ Kim Long Đơn",
        oldPrice: "890.000 đ", newPrice: "690.000 đ",
        tags: ["Mâm Từ Đơn", "Hẹn Giờ", "Cảm Ứng"],
        img: "https://images.unsplash.com/photo-1556819132-52350b2a7836?w=300&h=300&fit=crop"
      }
    ];

    const grid = document.getElementById('product-grid');
    grid.innerHTML = products.map(p => `
      <div class="hover-lift bg-white border border-slate-200 rounded-2xl overflow-hidden flex flex-col relative">
        ${p.badge ? `<span class="absolute top-2 left-2 bg-white text-ember text-xs font-display font-700 px-2.5 py-1 rounded-full z-10 shadow-[0_2px_4px_rgba(0,0,0,.15)] border border-ember/20">${p.badge}</span>` : ''}
        <div class="aspect-square bg-slate-100 flex items-center justify-center overflow-hidden">
          <img src="${p.img}" alt="${p.name}" class="object-cover w-full h-full">
        </div>
        <div class="relative h-5">
          <div class="absolute -top-4 left-0 right-0 flex items-stretch drop-shadow-md">
            <span class="promo-ribbon text-white text-[11px] font-display font-800 uppercase px-3 py-1.5 flex-1 flex items-center justify-center rounded-l-sm">Khuyến Mãi Đặc Biệt</span>
            <span class="promo-badge-3d text-amber-900 text-xs font-display font-800 px-2.5 py-1.5 flex items-center rounded-r-sm">${p.discount}</span>
          </div>
        </div>
        <div class="p-3 pt-6 flex flex-col gap-1 flex-1 font-body">
          <a href="#" class="focus-ring text-sm font-display font-700 text-navy-950 hover:text-brand transition-colors leading-snug line-clamp-2 min-h-[2.5em]">${p.name}</a>
          <div class="price-strike text-navy-900/40 text-sm">${p.oldPrice}</div>
          <div class="flex items-center gap-2">
            <span class="text-ember-dark font-display font-800 text-lg">${p.newPrice}</span>
            <span class="price-badge-3d text-white text-xs font-display font-700 px-1.5 py-0.5 rounded">${p.discount}</span>
          </div>
          <div class="flex flex-wrap gap-1 mt-1">
            ${p.tags.map(t => `<span class="border border-slate-200 rounded px-2 py-0.5 text-[11px] text-navy-900/50">${t}</span>`).join('')}
          </div>
        </div>
      </div>
    `).join('');

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js').catch(() => {});
    }
  </script>
</body>
</html>
